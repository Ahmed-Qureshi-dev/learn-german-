  <script>
    if (!window.storage) {
      window.storage = {
        get: async (key) => {
          try {
            const val = localStorage.getItem(key);
            return val ? { value: val } : null;
          } catch (e) {
            return null;
          }
        },
        set: async (key, val) => {
          try {
            localStorage.setItem(key, val);
            return true;
          } catch (e) {
            return false;
          }
        }
      };
    }

            attrs: {
              style: `width: ${size}px; height: ${size}px;`,
              class: className
            },
            nameAttr: 'data-lucide',
            root: ref.current
          });

      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" style={style} />;

    /* ============================================================

    let uidCounter = 0;
    function uid() {
      uidCounter += 1;
      return `w_${Date.now().toString(36)}_${uidCounter}_${Math.random().toString(36).slice(2, 7)}`;
    }
    function todayStr() { return new Date().toISOString().slice(0, 10); }
    function addDays(dateStr, n) {
      const d = new Date(dateStr + "T00:00:00");
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    }
    function diffDaysStr(a, b) {
      return Math.round((new Date(a + "T00:00:00") - new Date(b + "T00:00:00")) / 86400000);
    }
    function maxDateStr(a, b) { if (!a) return b; if (!b) return a; return a > b ? a : b; }
    function fmtDate(d) { return new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function sample(arr, n) { return shuffle(arr).slice(0, n); }
    function normalizeAnswer(s) {
      return (s || "").toLowerCase().trim().replace(/^(der|die|das)\s+/, "").replace(/[.,!?"']/g, "").replace(/\s+/g, " ");
    }
    function renderLite(text) {
      const parts = (text || "").split(/(\*\*[^*]+\*\*)/g);
      return parts.map((p, i) => p.startsWith("**") && p.endsWith("**")
        ? <strong key={i}>{p.slice(2, -2)}</strong>
        : <span key={i}>{p}</span>);
    }
    function getLevelInfo(wordCount) {
      const count = typeof wordCount === 'number' && !isNaN(wordCount) ? wordCount : 0;
      let idx = 0;
      for (let i = 0; i < LEVELS.length; i++) if (count >= LEVELS[i].min) idx = i;
      const current = LEVELS[idx];
      const next = LEVELS[idx + 1];
      const progress = next ? Math.min(1, Math.max(0, (count - current.min) / (next.min - current.min))) : 1;
      return { index: idx, current, next, progress: isNaN(progress) ? 0 : progress };
    }
    function speakGerman(text) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "de-DE";
        window.speechSynthesis.speak(utterance);
      }
    }

      const today = todayStr();
      const vocab = SEED_WORDS.map(([de, en, article, category]) => ({

      const today = todayStr();
      const ref = maxDateStr(stats.lastStreakDate, stats.goalBankedUntil);
      if (stats.streak > 0 && ref && diffDaysStr(today, ref) > 1) return { ...stats, streak: 0 };
      return stats;

    /* ---------- Claude API helpers (uses the built-in Anthropic API proxy) ---------- */
    async function claudeMessages(messages, system, maxTokens = 1000) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: maxTokens, system, messages }),
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
    }
    function parseJsonLoose(text) {
      let t = (text || "").trim();
      t = t.replace(/^```json/i, "").replace(/^```/, "").replace(/```$/, "").trim();
      const start = t.indexOf("["); const end = t.lastIndexOf("]");
      if (start !== -1 && end !== -1) t = t.slice(start, end + 1);
      return JSON.parse(t);
    }
    const AI_QUIZ_SCHEMA = {
      "sentence-translation": `[{"prompt_en": "I drink water.", "answer_de": "Ich trinke Wasser."}]`,
      "sentence-building": `[{"words": ["ich","trinke","Wasser"], "answer_de": "Ich trinke Wasser."}]`,
      "fill-blank": `[{"sentence": "Ich ___ Pizza.", "options": ["esse","trinke","gehe"], "answer": "esse"}]`,
      "conversation": `[{"lines": [{"speaker":"A","text_de":"Hallo, wie geht's?","text_en":"Hi, how are you?"},{"speaker":"B","text_de":"Gut, danke!","text_en":"Good, thanks!"}]}]`,
      "mistake-correction": `[{"wrong_de": "Ich trinken Wasser.", "correct_de": "Ich trinke Wasser."}]`,
    };
    function buildQuizSystemPrompt(type, n) {
      return `You create German A1 exercises for a vocabulary app. Respond with ONLY a raw JSON array of exactly ${n} items, no markdown fences, no commentary, no extra keys. Exact schema (one example item shown): ${AI_QUIZ_SCHEMA[type]}. Keep every German sentence short (max 7 words) and strictly A1-level grammar. Only use the learner's vocabulary below plus basic grammar glue words (articles, pronouns, common verb endings, prepositions). Vary sentence structure between items - do not repeat the same pattern.`;
    }
    function buildQuizUserPrompt(words, struggleWords, type, n) {
      return `Learner's known vocabulary: ${words.join(", ")}.\nWords the learner struggles with (use these where natural): ${struggleWords.join(", ") || "none yet"}.\nGenerate ${n} "${type}" exercises now.`;
    }

    function StampBadge({ value, label, color, textColor = "#fff", size = 92 }) {
      const r = size / 2 - 8;

          </defs>
          <circle cx={size / 2} cy={size / 2} r={r + 5} fill="none" stroke={color} strokeWidth="2" strokeDasharray="3 4" opacity="0.6" />
          <circle cx={size / 2} cy={size / 2} r={r - 7} fill={color} />
          <text fontSize="7.2" fontWeight="700" letterSpacing="2" fill={color}>
            <textPath href={`#${pathId}`} startOffset="2%">{label} • {label} • </textPath>
          </text>
          <text x="50%" y="53%" textAnchor="middle" dominantBaseline="middle" fontSize={size * 0.26} fontWeight="800" fill={textColor} fontFamily={DISPLAY_FONT}>{value}</text>

    function Modal({ onClose, children, th, title }) {

    function TextInput(props) {

      const weekLog = useMemo(() => {

          <div className="grid grid-cols-3 gap-3">
            {[
              { label: "Total words", value: data.vocab.length, color: th.cobalt, soft: th.cobaltSoft },
              { label: "Mastered", value: data.vocab.filter((w) => w.status === "mastered").length, color: th.forest, soft: th.forestSoft },

    function WordCard({ th, word, onEdit, onDelete, onToggleMastered, confirmingDelete, onConfirmDelete }) {

        <div className="rounded-2xl p-3.5" style={{ background: th.card, border: `1px solid ${th.border}` }}>

                  <Volume2 size={14} />

              <div className="flex items-center gap-2 mt-1.5">
                <span className="text-[10px] px-2 py-0.5 rounded-full font-semibold" style={{ background: th.cobaltSoft, color: th.cobalt }}>{word.category}</span>

            </div>

    function VocabularyView({ th, data, setData, showToast }) {

          if (search && !(w.german.toLowerCase().includes(search.toLowerCase()) || w.english.toLowerCase().includes(search.toLowerCase()))) return false;
          return true;
        }).sort((a, b) => (a.dateAdded < b.dateAdded ? 1 : -1));
      }, [data.vocab, catFilter, levelFilter, search]);

      const addWord = (form) => {
        const today = todayStr();
        setData((prev) => {
          const word = { id: uid(), ...form, correctCount: 0, incorrectCount: 0, streakCount: 0, status: "learning", dateAdded: today, nextReview: today, difficulty: "medium" };
          const vocab = [...prev.vocab, word];
          const log = { ...prev.stats.wordsAddedLog, [today]: (prev.stats.wordsAddedLog[today] || 0) + 1 };
          const addedToday = log[today];
          const dailyGoal = prev.profile.dailyGoal;
          let goalBankedUntil = prev.stats.goalBankedUntil;
          const bankedDays = Math.floor(addedToday / dailyGoal);
          if (bankedDays > 0) {
            const candidate = addDays(today, bankedDays - 1);
            if (!goalBankedUntil || candidate > goalBankedUntil) goalBankedUntil = candidate;
          }
          let streak = prev.stats.streak; let lastStreakDate = prev.stats.lastStreakDate;
          const goalMetToday = goalBankedUntil && goalBankedUntil >= today;
          if (goalMetToday && lastStreakDate !== today) {
            if (lastStreakDate === addDays(today, -1)) streak += 1;
            else if (!lastStreakDate || lastStreakDate < addDays(today, -1)) streak = 1;
            lastStreakDate = today;
          }
          return {
            ...prev, vocab,
            stats: {
              ...prev.stats, wordsAddedLog: log, goalBankedUntil, streak, lastStreakDate,
              xp: prev.stats.xp + 5, totalWordsLearned: vocab.length,
              history: [{ type: "add", text: `Added "${word.german}"`, date: new Date().toISOString(), xp: 5 }, ...prev.stats.history].slice(0, 50),
            },

        setConfirmingId(null);
      };
      const toggleMastered = (id) => {
        setData((prev) => ({ ...prev, vocab: prev.vocab.map((w) => (w.id === id ? { ...w, status: w.status === "mastered" ? "learning" : "mastered" } : w)) }));
      };

      return (
        <div className="space-y-3 pb-4">
          <div className="flex gap-2">
            <div className="flex-1 flex items-center gap-2 rounded-xl px-3 py-2.5" style={{ background: th.card, border: `1px solid ${th.border}` }}>
              <Search size={15} style={{ color: th.sub }} />
              <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search words..." className="flex-1 bg-transparent outline-none text-sm" style={{ color: th.ink }} />
            </div>
            <button onClick={() => setShowAdd(true)} className="px-4 rounded-xl font-bold text-white flex items-center gap-1" style={{ background: th.cobalt }}>
              <Plus size={16} /> Add
            </button>
          </div>
          <div className="flex gap-2 overflow-x-auto pb-1">
            <Chip th={th} active={levelFilter === "All"} onClick={() => setLevelFilter("All")}>All levels</Chip>
            {["A1", "A2", "B1"].map((l) => <Chip key={l} th={th} active={levelFilter === l} onClick={() => setLevelFilter(l)} color={th.mustard}>{l}</Chip>)}
          </div>
          <div className="flex gap-2 overflow-x-auto pb-1">
            <Chip th={th} active={catFilter === "All"} onClick={() => setCatFilter("All")}>All categories</Chip>
            {CATEGORIES.map((c) => <Chip key={c} th={th} active={catFilter === c} onClick={() => setCatFilter(c)}>{c}</Chip>)}
          </div>
          <div className="text-xs" style={{ color: th.sub }}>{filtered.length} word{filtered.length !== 1 ? "s" : ""}</div>

    function buildQuickQuestion(word, pool, allowedTypes) {
      const usableTypes = allowedTypes.filter((t) => t !== "article" || word.article);
      const type = usableTypes[Math.floor(Math.random() * usableTypes.length)];
      const others = pool.filter((w) => w.id !== word.id);
      if (type === "de-en" || type === "en-de") {
        const distractors = sample(others, Math.min(3, others.length)).map((w) => (type === "de-en" ? w.english : w.german));
        const correct = type === "de-en" ? word.english : word.german;
        const options = shuffle([correct, ...distractors].filter((v, i, a) => a.indexOf(v) === i));
        return { id: uid(), word, type, prompt: type === "de-en" ? word.german : word.english, options, correct };
      }
      if (type === "spelling") return { id: uid(), word, type, prompt: word.english, correct: word.german };
      if (type === "article") {
        const options = shuffle(["der", "die", "das"]);
        return { id: uid(), word, type, prompt: word.german, options, correct: word.article };
      }
      return { id: uid(), word, type: "de-en", prompt: word.german, options: [word.english], correct: word.english };
    }

          <input value={typed} disabled={answered} onChange={(e) => setTyped(e.target.value)} placeholder="Type your answer..."
            className="w-full rounded-xl px-4 py-3 text-sm outline-none border font-semibold"
            style={{ background: th.bg, color: th.ink, borderColor: answered ? (normalizeAnswer(typed) === normalizeAnswer(answerKey) ? th.forest : th.brick) : th.border }} />
          {answered && (

          {!answered && <button onClick={() => onAnswer(normalizeAnswer(typed) === normalizeAnswer(answerKey), typed)} disabled={!typed.trim()} className="w-full mt-3 py-3 rounded-xl font-bold text-white disabled:opacity-40" style={{ background: th.cobalt }}>Check</button>}

    function SentenceBuilder({ th, item, onAnswer, answered }) {
      const [chosen, setChosen] = useState([]);
      const [bank, setBank] = useState(() => shuffle(item.words));
      const pick = (w, i) => { setChosen((c) => [...c, w]); setBank((b) => b.filter((_, idx) => idx !== i)); };
      const remove = (i) => { setBank((b) => [...b, chosen[i]]); setChosen((c) => c.filter((_, idx) => idx !== i)); };
      const submit = () => onAnswer(normalizeAnswer(chosen.join(" ")) === normalizeAnswer(item.answer_de), chosen.join(" "));
      return (

          <div className="text-xs font-semibold mb-1" style={{ color: th.sub }}>Build the sentence</div>

            ))}
          </div>
          <div className="flex flex-wrap gap-2 mb-3">

      );

    const QUICK_TYPES = [
      { id: "de-en", label: "German → English" }, { id: "en-de", label: "English → German" },
      { id: "spelling", label: "Spelling" }, { id: "article", label: "Article (der/die/das)" },
    ];
    const AI_TYPES = [
      { id: "sentence-translation", label: "Sentence translation" }, { id: "sentence-building", label: "Sentence building" },
      { id: "fill-blank", label: "Fill in the blank" }, { id: "conversation", label: "Conversation practice" },
      { id: "mistake-correction", label: "Mistake correction" },
    ];

    function QuizHub({ th, data, setData, showToast, setCelebrate, goalMetToday }) {
      const [mode, setMode] = useState("menu");
      const [quickTypes, setQuickTypes] = useState(["de-en", "en-de"]);
      const [aiType, setAiType] = useState("sentence-translation");
      const [count, setCount] = useState(8);
      const [questions, setQuestions] = useState([]);
      const [qIndex, setQIndex] = useState(0);
      const [answered, setAnswered] = useState(false);
      const [selected, setSelected] = useState(null);
      const [correctSoFar, setCorrectSoFar] = useState(0);
      const [aiError, setAiError] = useState("");
      const [fIndex, setFIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [flashcardWords, setFlashcardWords] = useState([]);
      const [fcCount, setFcCount] = useState(10);

      const startFlashcardsSetup = () => {
        setMode("flashcards-setup");
      };
      const startFlashcards = (filterType) => {
        let pool = [...data.vocab];
        const today = todayStr();
        if (filterType === 'due') {
          pool = pool.filter((w) => w.nextReview <= today);
        } else if (filterType === 'struggle') {
          pool = pool.filter((w) => w.incorrectCount > w.correctCount);
        }
        if (pool.length === 0) pool = [...data.vocab];
        const selected = shuffle(pool).slice(0, fcCount);
        setFlashcardWords(selected);
        setFIndex(0);
        setIsFlipped(false);
        setMode("flashcards-session");
      };
      const handleFlashcardReview = (wordId, gotIt) => {
        applyWordResult(wordId, gotIt);
        if (fIndex + 1 >= flashcardWords.length) {
          const xpGain = 15;
          setData((prev) => ({
            ...prev,
            stats: {
              ...prev.stats, xp: prev.stats.xp + xpGain,
              history: [{ type: "flashcards", text: `Studied ${flashcardWords.length} flashcards`, date: new Date().toISOString(), xp: xpGain }, ...prev.stats.history].slice(0, 50),
            },
          }));
          showToast(`+${xpGain} XP · Study complete!`, th.forest);
          setMode("flashcard-summary");
        } else {
          setIsFlipped(false);
          setFIndex((i) => i + 1);
        }
      };

      const dueSorted = useMemo(() => {
        const today = todayStr();
        return [...data.vocab].sort((a, b) => {
          const aDue = a.nextReview <= today ? 0 : 1; const bDue = b.nextReview <= today ? 0 : 1;
          if (aDue !== bDue) return aDue - bDue;
          return (b.incorrectCount - b.correctCount) - (a.incorrectCount - a.correctCount);
        });
      }, [data.vocab]);
      const struggleWords = useMemo(() => data.vocab.filter((w) => w.incorrectCount > w.correctCount).map((w) => w.german), [data.vocab]);

      const applyWordResult = useCallback((wordId, correct) => {
        setData((prev) => {
          const today = todayStr();
          const vocab = prev.vocab.map((w) => {
            if (w.id !== wordId) return w;
            if (correct) {
              const streakCount = (w.streakCount || 0) + 1;
              const interval = INTERVALS[Math.min(streakCount - 1, INTERVALS.length - 1)];
              return { ...w, correctCount: w.correctCount + 1, streakCount, nextReview: addDays(today, interval), status: streakCount >= 5 ? "mastered" : w.status, difficulty: "easy" };
            }
            return { ...w, incorrectCount: w.incorrectCount + 1, streakCount: 0, nextReview: addDays(today, 1), status: w.status === "mastered" ? "learning" : w.status, difficulty: "hard" };
          });
          return { ...prev, vocab };
        });
      }, [setData]);

      const finishQuiz = useCallback((totalCorrect, total) => {
        const perfect = totalCorrect === total && total > 0;
        const xpGain = perfect ? 50 : 20;
        setData((prev) => ({
          ...prev,
          quizHistory: [{ date: new Date().toISOString(), score: totalCorrect, total, perfect }, ...prev.quizHistory].slice(0, 100),
          stats: {
            ...prev.stats, xp: prev.stats.xp + xpGain,
            history: [{ type: "quiz", text: perfect ? "Perfect quiz score!" : `Completed a quiz (${totalCorrect}/${total})`, date: new Date().toISOString(), xp: xpGain }, ...prev.stats.history].slice(0, 50),
          },
        }));
        showToast(`+${xpGain} XP${perfect ? " · Perfect!" : ""}`, perfect ? th.mustard : th.forest);
        setMode("summary");
      }, [setData, showToast, th]);

      const startQuick = () => {
        const chosen = dueSorted.slice(0, Math.min(count, dueSorted.length));
        if (chosen.length === 0) { setMode("menu"); return; }
        const qs = chosen.map((w) => buildQuickQuestion(w, data.vocab, quickTypes.length ? quickTypes : ["de-en"]));
        setQuestions(qs); setQIndex(0); setAnswered(false); setSelected(null); setCorrectSoFar(0); setMode("quick-session");
      };
      const answerQuick = (isCorrect, sel) => {
        setAnswered(true); setSelected(sel);
        applyWordResult(questions[qIndex].word.id, isCorrect);
        if (isCorrect) setCorrectSoFar((c) => c + 1);
      };
      const nextQuick = () => {
        if (qIndex + 1 >= questions.length) { finishQuiz(correctSoFar, questions.length); return; }
        setQIndex((i) => i + 1); setAnswered(false); setSelected(null);
      };

      const startAI = async () => {
        setMode("ai-loading"); setAiError("");
        try {
          const wordSample = sample(data.vocab, Math.min(50, data.vocab.length)).map((w) => (w.article ? w.article + " " : "") + w.german);
          const system = buildQuizSystemPrompt(aiType, Math.min(count, 6));
          const user = buildQuizUserPrompt(wordSample, struggleWords.slice(0, 15), aiType, Math.min(count, 6));
          const text = await claudeMessages([{ role: "user", content: user }], system, 1000);
          const items = parseJsonLoose(text).map((it) => ({ ...it, id: uid(), type: aiType }));
          if (!items.length) throw new Error("empty");
          setQuestions(items); setQIndex(0); setAnswered(false); setSelected(null); setCorrectSoFar(0); setMode("ai-session");
        } catch (e) {
          setAiError("Couldn't reach the AI teacher to generate this quiz. Check your connection and try again.");
          setMode("ai-error");
        }
      };
      const answerAI = (isCorrect, sel) => { setAnswered(true); setSelected(sel); if (isCorrect) setCorrectSoFar((c) => c + 1); };
      const nextAI = () => {
        if (qIndex + 1 >= questions.length) { finishQuiz(correctSoFar, questions.length); return; }
        setQIndex((i) => i + 1); setAnswered(false); setSelected(null);
      };

      useEffect(() => { if (mode === "summary" && goalMetToday) setCelebrate(true); }, [mode]);

      if (mode === "menu") {
        return (
          <div className="space-y-4 pb-4">
            <div className="rounded-2xl p-4" style={{ background: th.card, border: `1px solid ${th.border}` }}>

    /* ============================================================
       AI TEACHER
       ============================================================ */
    function TeacherView({ th, data, setData }) {
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const scrollRef = useRef(null);
      useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" }); }, [data.teacherChat, loading]);

      const send = async (text) => {
        const msg = (text || input).trim();
        if (!msg || loading) return;
        setInput(""); setLoading(true);
        const history = [...data.teacherChat, { role: "user", content: msg }].slice(-40);
        setData((prev) => ({ ...prev, teacherChat: history }));
        try {
          const apiMessages = history.map((m) => ({ role: m.role, content: m.content }));
          const contextNote = `(Learner context: knows ${data.vocab.length} words, currently at ${getLevelInfo(data.vocab ? data.vocab.length : 0).current.name} level.)`;
          const reply = await claudeMessages(apiMessages, TEACHER_SYSTEM_PROMPT + " " + contextNote, 1000);
          setData((prev) => ({ ...prev, teacherChat: [...prev.teacherChat, { role: "assistant", content: reply || "Sorry, I couldn't come up with an answer — try asking again." }].slice(-40) }));
        } catch (e) {
          setData((prev) => ({ ...prev, teacherChat: [...prev.teacherChat, { role: "assistant", content: "I couldn't reach the AI teacher right now. Check your connection and try again." }].slice(-40) }));
        } finally { setLoading(false); }
      };
      const suggestions = ["Explain \"gehen\"", "Correct: Ich gehen Schule", "How do I say I'm hungry?", "der/die/das rule?"];

      return (
        <div className="flex flex-col" style={{ height: "calc(100% - 0px)" }}>
          <div ref={scrollRef} className="flex-1 overflow-y-auto space-y-3 pb-3" style={{ minHeight: 320, maxHeight: 420 }}>
            {data.teacherChat.length === 0 && (
              <div className="rounded-2xl p-4 text-sm" style={{ background: th.cobaltSoft, color: th.cobalt }}>
                Hallo! I'm your AI German teacher. Ask me to explain a word, check your grammar, or build example sentences — all kept at your A1 level.
              </div>
            )}
            {data.teacherChat.map((m, i) => (
              <div key={i} className={"max-w-[85%] rounded-2xl px-3.5 py-2.5 text-sm " + (m.role === "user" ? "ml-auto" : "")}
                style={m.role === "user" ? { background: th.cobalt, color: "#fff" } : { background: th.card, color: th.ink, border: `1px solid ${th.border}` }}>
                {renderLite(m.content)}
              </div>
            ))}
            {loading && <div className="rounded-2xl px-3.5 py-2.5 text-sm w-fit" style={{ background: th.card, border: `1px solid ${th.border}` }}><Loader2 size={14} className="animate-spin" style={{ color: th.sub }} /></div>}
          </div>
          {data.teacherChat.length === 0 && (
            <div className="flex flex-wrap gap-2 mb-2">
              {suggestions.map((s) => <button key={s} onClick={() => send(s)} className="text-xs font-semibold px-3 py-1.5 rounded-full" style={{ background: th.bg, color: th.sub }}>{s}</button>)}
            </div>
          )}
          <div className="flex items-center gap-2 shrink-0">
            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Ask about a word, grammar, or a sentence..."
              className="flex-1 rounded-xl px-3.5 py-3 text-sm outline-none border" style={{ background: th.card, color: th.ink, borderColor: th.border }} />
            <button onClick={() => send()} disabled={loading || !input.trim()} className="p-3 rounded-xl text-white disabled:opacity-40" style={{ background: th.cobalt }}><Send size={16} /></button>
          </div>
        </div>
      );
    }

                <button onClick={() => setConfirmReset(false)} className="flex-1 py-2.5 rounded-xl font-semibold text-sm" style={{ background: th.bg, color: th.sub }}>Cancel</button>
                <button onClick={onResetAll} className="flex-1 py-2.5 rounded-xl font-semibold text-sm text-white" style={{ background: th.brick }}>Confirm reset</button>

            )}

      );

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState("dashboard");
      const [toast, setToast] = useState(null);
      const [celebrate, setCelebrate] = useState(false);
      const saveTimer = useRef(null);
      const prevGoalMet = useRef(false);

      useEffect(() => {
        const linkId = "gv-fonts-link";
        if (!document.getElementById(linkId)) {
          const link = document.createElement("link");
          link.id = linkId; link.rel = "stylesheet";
          link.href = "https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap";
          document.head.appendChild(link);
        }
      }, []);

      useEffect(() => {
        (async () => {
          let fresh = null;
          try {
            const res = await window.storage.get("appData", false);
            fresh = res ? JSON.parse(res.value) : null;
          } catch (e) { fresh = null; }
          if (!fresh) {
            fresh = createInitialData();
            try { await window.storage.set("appData", JSON.stringify(fresh), false); } catch (e) {}
          } else {
            if (!fresh.stats) fresh.stats = createInitialData().stats;
            if (!fresh.vocab) fresh.vocab = createInitialData().vocab;
            if (!fresh.profile) fresh.profile = createInitialData().profile;
            if (!fresh.quizHistory) fresh.quizHistory = [];
            if (!fresh.teacherChat) fresh.teacherChat = [];
            if (!fresh.stats.wordsAddedLog) fresh.stats.wordsAddedLog = {};
            fresh = { ...fresh, stats: checkStreakDecay(fresh.stats) };
          }
          setData(fresh); setLoading(false);
        })();
      }, []);

      useEffect(() => {
        if (loading || !data) return;
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => { window.storage.set("appData", JSON.stringify(data), false).catch(() => {}); }, 500);
        return () => clearTimeout(saveTimer.current);
      }, [data, loading]);

      const showToast = useCallback((text, color) => {
        setToast({ text, color, key: Date.now() });
        setTimeout(() => setToast(null), 1900);
      }, []);

      const dueWords = useMemo(() => {
        if (!data) return [];
        const today = todayStr();
        return data.vocab.filter((w) => w.nextReview <= today);
      }, [data]);
      const todayAdded = data ? ((data.stats.wordsAddedLog && data.stats.wordsAddedLog[todayStr()]) || 0) : 0;
      const goalMetToday = data ? (data.stats.goalBankedUntil && data.stats.goalBankedUntil >= todayStr()) : false;

      useEffect(() => {
        if (goalMetToday && !prevGoalMet.current) setCelebrate(true);
        prevGoalMet.current = goalMetToday;
      }, [goalMetToday]);

      const toggleDark = () => setData((prev) => ({ ...prev, profile: { ...prev.profile, darkMode: !prev.profile.darkMode } }));
      const resetAll = async () => {
        const fresh = createInitialData();
        setData(fresh);
        try { await window.storage.set("appData", JSON.stringify(fresh), false); } catch (e) {}
        setActiveTab("dashboard");
      };

      if (loading || !data) {
        return (
          <div className="w-full flex items-center justify-center" style={{ minHeight: 500, fontFamily: BODY_FONT }}>
            <Loader2 size={26} className="animate-spin" style={{ color: "#2B4C7E" }} />
          </div>
        );
      }

      const th = PALETTE[data.profile.darkMode ? "dark" : "light"];

      return (
        <div className="w-full mx-auto rounded-3xl overflow-hidden flex flex-col shadow-xl" style={{ maxWidth: 460, height: 780, background: th.bg, color: th.ink, fontFamily: BODY_FONT, position: "relative" }}>
          <style>{`
            @keyframes stampFall { 0%{ transform: translateY(-20px) rotate(0deg); opacity:0;} 10%{opacity:1;} 100%{ transform: translateY(500px) rotate(360deg); opacity:0; } }
            @keyframes popIn { 0%{ transform: scale(0.85); opacity:0;} 100%{ transform: scale(1); opacity:1; } }
            @keyframes floatUp { 0%{ transform: translate(-50%,0); opacity:1;} 80%{ opacity:1;} 100%{ transform: translate(-50%,-30px); opacity:0; } }
            .perspective-1000 { perspective: 1000px; }
            .preserve-3d { transform-style: preserve-3d; }
            .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
            .rotate-y-180 { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
            .flipped { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
          `}</style>
          <TopBar th={th} stats={data.stats} darkMode={data.profile.darkMode} onToggleDark={toggleDark} />
          <div className="flex-1 overflow-y-auto px-4 pt-1">
            {activeTab === "dashboard" && <Dashboard th={th} data={data} dueWords={dueWords} goalMetToday={goalMetToday} todayAdded={todayAdded} onGoTab={setActiveTab} />}
            {activeTab === "vocab" && <VocabularyView th={th} data={data} setData={setData} showToast={showToast} />}
            {activeTab === "quiz" && <QuizHub th={th} data={data} setData={setData} showToast={showToast} setCelebrate={setCelebrate} goalMetToday={goalMetToday} />}
            {activeTab === "teacher" && <TeacherView th={th} data={data} setData={setData} />}
            {activeTab === "profile" && <ProfileView th={th} data={data} setData={setData} onResetAll={resetAll} />}
          </div>
          <BottomNav active={activeTab} onChange={setActiveTab} th={th} />
          {celebrate && <CelebrationOverlay th={th} onDone={() => setCelebrate(false)} />}
          {toast && <Toast key={toast.key} text={toast.text} color={toast.color} th={th} />}
        </div>
      );
    }

    // Mount React App inside root container
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
