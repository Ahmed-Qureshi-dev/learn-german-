        get: async (key) => {
          try {
            const val = localStorage.getItem(key);
            return val ? { value: val } : null;
          } catch (e) {
            return null;
          }
        },
        set: async (key, val) => {
          try {
            localStorage.setItem(key, val);

          } catch (e) {
            return false;
          }
        }
      };

            attrs: {
              style: `width: ${size}px; height: ${size}px;`,
              class: className
            },
            nameAttr: 'data-lucide',
            root: ref.current
          });
        }
      }, [name, size, className, style]);

      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" style={style} />;

    function get20DailySpotlightWords(userVocab = []) {
      const pool = [...userVocab];
      pool.sort((a, b) => {

        const diffB = (b.incorrectCount || 0) - (b.correctCount || 0);
        if (diffA !== diffB) return diffB - diffA;
        return a.dateAdded < b.dateAdded ? 1 : -1;
      });

      const selected = [];
      const seen = new Set();

      for (const w of pool) {
        const norm = (w.german || "").toLowerCase().trim();
        if (!seen.has(norm)) {
          seen.add(norm);
          selected.push(w);
        }
        if (selected.length >= 20) break;
      }

          if (!seen.has(norm)) {

    let uidCounter = 0;
    function uid() {

    function addDays(dateStr, n) {
      const d = new Date(dateStr + "T00:00:00");
      d.setDate(d.getDate() + n);
      return d.toISOString().slice(0, 10);
    }
    function diffDaysStr(a, b) {
      return Math.round((new Date(a + "T00:00:00") - new Date(b + "T00:00:00")) / 86400000);
    }
    function maxDateStr(a, b) { if (!a) return b; if (!b) return a; return a > b ? a : b; }
    function fmtDate(d) { return new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    function sample(arr, n) { return shuffle(arr).slice(0, n); }

    // Appilix / Mobile WebView Audio Auto-Unlocker
    let globalAudioPlayer = null;
    let audioUnlocked = false;

    function unlockAudioContext() {
      if (!audioUnlocked) {
        audioUnlocked = true;
        try {
          if (!globalAudioPlayer) {
            globalAudioPlayer = new Audio();
          }
          globalAudioPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
          globalAudioPlayer.play().catch(() => {});
        } catch(e) {}
      }
    }

    if (typeof window !== "undefined") {
      window.addEventListener("click", unlockAudioContext, { passive: true });
      window.addEventListener("touchstart", unlockAudioContext, { passive: true });
    }

    function playWebViewAudio(text) {
      if (!text) return;
      const cleanText = text.trim();
      const encoded = encodeURIComponent(cleanText);

      const sources = [
        `https://dict.youdao.com/dictvoice?audio=${encoded}&type=2`,
        `https://translate.google.com/translate_tts?ie=UTF-8&tl=de&client=tw-ob&q=${encoded}`
      ];

      if (!globalAudioPlayer) {
        globalAudioPlayer = new Audio();
      }

      let srcIdx = 0;
      const playCurrent = () => {
        if (srcIdx >= sources.length) return;
        try {
          globalAudioPlayer.pause();
          globalAudioPlayer.src = sources[srcIdx];
          globalAudioPlayer.load();
          const promise = globalAudioPlayer.play();
          if (promise !== undefined) {
            promise.catch(() => {
              srcIdx++;
              playCurrent();
            });
          }
        } catch(e) {
          srcIdx++;
          playCurrent();
        }
      };

      playCurrent();
    }

    function speakGerman(text, slow = false) {
      if (!text || !text.trim()) return;
      const cleanText = text.trim();

      unlockAudioContext();

      let webSpeechSuccess = false;

      if ("speechSynthesis" in window) {
        try {
          if (window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }

          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = "de-DE";
          utterance.rate = slow ? 0.6 : 0.9;

          if (!germanVoice) loadGermanVoice();
          if (germanVoice) utterance.voice = germanVoice;

          utterance.onstart = () => { webSpeechSuccess = true; };
          utterance.onerror = () => {
            if (!webSpeechSuccess) playWebViewAudio(cleanText);
          };

          window.speechSynthesis.speak(utterance);

          // Fast 220ms check for Android Appilix WebView silent speech handling
          setTimeout(() => {
            if (!webSpeechSuccess && (!window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
              playWebViewAudio(cleanText);
            }
          }, 220);
          return;
        } catch (e) {
          playWebViewAudio(cleanText);
          return;
        }
      }

      playWebViewAudio(cleanText);
    }

    async function claudeMessages(messages, system, maxTokens = 1000) {
      const apiKey = window.localStorage.getItem("anthropic_api_key") || "";
      const headers = { "Content-Type": "application/json" };
      if (apiKey) {
        headers["x-api-key"] = apiKey;
        headers["anthropic-version"] = "2023-06-01";
        headers["dangerously-allow-browser-headers"] = "true";
      }
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers,
        body: JSON.stringify({ model: "claude-3-5-sonnet-20241022", max_tokens: maxTokens, system, messages }),
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
    }

    function generateFallbackAIQuiz(aiType, n, vocab, struggleWords = []) {
      const items = [];
      const pool = (vocab && vocab.length > 0) ? vocab : SEED_WORDS.map(([de, en, art]) => ({ german: de, english: en, article: art || "" }));

      for (let i = 0; i < n; i++) {
        const wordObj = pool[i % pool.length];
        const g = wordObj.german || "Wasser";
        const e = wordObj.english || "water";
        const art = wordObj.article ? wordObj.article + " " : "";

        if (aiType === "sentence-translation") {
          const templates = [
            { prompt_en: `I like ${e}.`, answer_de: `Ich mag ${art}${g}.` },
            { prompt_en: `Where is ${art ? "the" : ""} ${e}?`, answer_de: `Wo ist ${art || "das "}${g}?` },
            { prompt_en: `We have ${e}.`, answer_de: `Wir haben ${art}${g}.` },
            { prompt_en: `That is ${art ? "a" : ""} ${e}.`, answer_de: `Das ist ${art || "ein "}${g}.` }
          ];
          const t = templates[i % templates.length];
          items.push({ id: uid(), type: aiType, ...t });
        } else if (aiType === "sentence-building") {
          const sentences = [
            `Ich trinke gerne ${g}.`,
            `Wo ist ${art || "das "}${g}?`,
            `Das ist ein schönes ${g}.`,
            `Wir brauchen heute ${art}${g}.`
          ];
          const ans = sentences[i % sentences.length].trim();
          const tokens = ans.replace(/[.,!?]/g, "").split(" ");
          items.push({ id: uid(), type: aiType, words: shuffle(tokens), answer_de: ans });
        } else if (aiType === "fill-blank") {
          const options = shuffle([g, "gehen", "kommen", "machen"]).slice(0, 3);
          if (!options.includes(g)) options[0] = g;
          items.push({
            id: uid(), type: aiType,
            sentence: `Ich möchte ___ (${e}).`,
            options: shuffle(options),
            answer: g
          });
        } else if (aiType === "conversation") {
          items.push({
            id: uid(), type: aiType,
            lines: [
              { speaker: "A", text_de: `Hallo! Hast du ${art}${g}?`, text_en: `Hello! Do you have ${e}?` },
              { speaker: "B", text_de: `Ja, ich habe ${art}${g}. Bitte sehr!`, text_en: `Yes, I have ${e}. Here you go!` }
            ]
          });
        } else {
          // mistake-correction
          const mistakes = [
            { wrong_de: `Ich haben ${g}.`, correct_de: `Ich habe ${g}.` },
            { wrong_de: `Wo ist der ${g}?`, correct_de: `Wo ist ${art || "das "}${g}?` },
            { wrong_de: `Du ist sehr gut.`, correct_de: `Du bist sehr gut.` },
            { wrong_de: `Wir geht nach Hause.`, correct_de: `Wir gehen nach Hause.` }
          ];
          items.push({ id: uid(), type: aiType, ...mistakes[i % mistakes.length] });
        }
      }
      return items;
    }

    function VocabularyView({ th, data, setData, showToast, slowAudio }) {
      const [vocabSubTab, setVocabSubTab] = useState("words"); // "words" or "grammar"
      const [search, setSearch] = useState("");
      const [catFilter, setCatFilter] = useState("All");

      const [editing, setEditing] = useState(null);

      const [confirmingId, setConfirmingId] = useState(null);

      const filtered = useMemo(() => {
        return data.vocab.filter((w) => {
          if (catFilter !== "All" && w.category !== catFilter) return false;
          if (levelFilter !== "All" && w.level !== levelFilter) return false;
          if (search && !(w.german.toLowerCase().includes(search.toLowerCase()) || w.english.toLowerCase().includes(search.toLowerCase()))) return false;
          return true;
        }).sort((a, b) => (a.dateAdded < b.dateAdded ? 1 : -1));
      }, [data.vocab, catFilter, levelFilter, search]);

      const addWord = (form) => {
        const today = todayStr();
        let article = form.article || "";
        let cleanGerman = (form.german || "").trim();

        // Auto-extract article if user typed "der Tisch", "die Katze", "das Haus"
        if (/^der\s+/i.test(cleanGerman)) { article = "der"; cleanGerman = cleanGerman.replace(/^der\s+/i, ""); }
        else if (/^die\s+/i.test(cleanGerman)) { article = "die"; cleanGerman = cleanGerman.replace(/^die\s+/i, ""); }
        else if (/^das\s+/i.test(cleanGerman)) { article = "das"; cleanGerman = cleanGerman.replace(/^das\s+/i, ""); }

        const wordId = uid();
        const word = {
          id: wordId,
          german: cleanGerman,
          english: form.english.trim(),
          article: article,
          plural: form.plural || "",
          category: form.category || "Actions",
          level: form.level || "A1",
          example: form.example || `Ich kenne ${cleanGerman}.`,
          exampleEn: form.exampleEn || `I know ${form.english.trim()}.`,
          notes: form.notes || "",
          correctCount: 0, incorrectCount: 0, streakCount: 0,
          status: "learning", dateAdded: today, nextReview: today, difficulty: "medium"
        };

        setData((prev) => {
          const vocab = [...prev.vocab, word];
          const log = { ...prev.stats.wordsAddedLog, [today]: (prev.stats.wordsAddedLog[today] || 0) + 1 };
          const addedToday = log[today];
          const dailyGoal = prev.profile.dailyGoal;
          let goalBankedUntil = prev.stats.goalBankedUntil;
          const bankedDays = Math.floor(addedToday / dailyGoal);
          if (bankedDays > 0) {
            const candidate = addDays(today, bankedDays - 1);
            if (!goalBankedUntil || candidate > goalBankedUntil) goalBankedUntil = candidate;
          }
          let streak = prev.stats.streak; let lastStreakDate = prev.stats.lastStreakDate;
          const goalMetToday = goalBankedUntil && goalBankedUntil >= today;
          if (goalMetToday && lastStreakDate !== today) {
            if (lastStreakDate === addDays(today, -1)) streak += 1;
            else if (!lastStreakDate || lastStreakDate < addDays(today, -1)) streak = 1;
            lastStreakDate = today;
          }
          return {
            ...prev, vocab,
            stats: {
              ...prev.stats, wordsAddedLog: log, goalBankedUntil, streak, lastStreakDate,
              xp: prev.stats.xp + 5, totalWordsLearned: vocab.length,
              history: [{ type: "add", text: `Added "${word.german}"`, date: new Date().toISOString(), xp: 5 }, ...prev.stats.history].slice(0, 50),
            },
          };
        });
        setShowAdd(false);
        showToast("+5 XP · word added ✨ AI enriching...", th.forest);

        // Async AI enrichment call
        enrichWordWithAI(wordId, cleanGerman, form.english.trim(), setData);

      const saveEdit = (form) => {
        setData((prev) => ({ ...prev, vocab: prev.vocab.map((w) => (w.id === editing.id ? { ...w, ...form } : w)) }));

      const deleteWord = (id) => {
        setData((prev) => ({ ...prev, vocab: prev.vocab.filter((w) => w.id !== id), stats: { ...prev.stats, totalWordsLearned: prev.vocab.length - 1 } }));

      };
      const toggleMastered = (id) => {
        setData((prev) => ({ ...prev, vocab: prev.vocab.map((w) => (w.id === id ? { ...w, status: w.status === "mastered" ? "learning" : "mastered" } : w)) }));
      };

      return (
        <div className="space-y-3 pb-4">
          {/* Sub-tab switcher */}
          <div className="flex gap-2 mb-2">

              <BookOpen size={15} /> All Words ({data.vocab.length})
            </button>
            <button onClick={() => setVocabSubTab("grammar")} className="flex-1 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border transition-all active:scale-[0.98]"
              style={vocabSubTab === "grammar" ? { background: th.mustard, color: "#fff", borderColor: th.mustard } : { background: th.card, color: th.sub, borderColor: th.border }}>
              <Sparkles size={15} /> Grammar & Helpers
            </button>
          </div>

          {vocabSubTab === "grammar" ? (
            <GrammarHelperView th={th} data={data} setData={setData} slowAudio={slowAudio} />
          ) : (
            <>
              <div className="flex gap-2">
                <div className="flex-1 flex items-center gap-2 rounded-xl px-3 py-2.5" style={{ background: th.card, border: `1px solid ${th.border}` }}>
                  <Search size={15} style={{ color: th.sub }} />
                  <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search words..." className="flex-1 bg-transparent outline-none text-sm" style={{ color: th.ink }} />
                </div>
                <button onClick={() => setShowAdd(true)} className="px-4 rounded-xl font-bold text-white flex items-center gap-1 transition-all active:scale-95" style={{ background: th.cobalt }}>
                  <Plus size={16} /> Add
                </button>
              </div>
              <div className="flex gap-2 overflow-x-auto pb-1">
                <Chip th={th} active={levelFilter === "All"} onClick={() => setLevelFilter("All")}>All levels</Chip>
                {["A1", "A2", "B1"].map((l) => <Chip key={l} th={th} active={levelFilter === l} onClick={() => setLevelFilter(l)} color={th.mustard}>{l}</Chip>)}
              </div>
              <div className="flex gap-2 overflow-x-auto pb-1">
                <Chip th={th} active={catFilter === "All"} onClick={() => setCatFilter("All")}>All categories</Chip>
                {CATEGORIES.map((c) => <Chip key={c} th={th} active={catFilter === c} onClick={() => setCatFilter(c)}>{c}</Chip>)}
              </div>
              <div className="text-xs" style={{ color: th.sub }}>{filtered.length} word{filtered.length !== 1 ? "s" : ""}</div>
              <div className="space-y-2.5">
                {filtered.map((w) => (
                  <WordCard key={w.id} th={th} word={w} onEdit={setEditing} onDelete={(id) => setConfirmingId(id)}

          {showAdd && <WordFormModal th={th} onSave={addWord} onClose={() => setShowAdd(false)} />}
          {editing && <WordFormModal th={th} initial={editing} onSave={saveEdit} onClose={() => setEditing(null)} />}

      );

    function buildQuickQuestion(word, pool, allowedTypes) {
      const usableTypes = allowedTypes.filter((t) => t !== "article" || word.article);
      const type = usableTypes[Math.floor(Math.random() * usableTypes.length)];
      const others = pool.filter((w) => w.id !== word.id);
      if (type === "de-en" || type === "en-de") {
        const distractors = sample(others, Math.min(3, others.length)).map((w) => (type === "de-en" ? w.english : w.german));
        const correct = type === "de-en" ? word.english : word.german;
        const options = shuffle([correct, ...distractors].filter((v, i, a) => a.indexOf(v) === i));
        return { id: uid(), word, type, prompt: type === "de-en" ? word.german : word.english, options, correct };
      }
      if (type === "spelling") return { id: uid(), word, type, prompt: word.english, correct: word.german };
      if (type === "article") {
        const options = shuffle(["der", "die", "das"]);
        return { id: uid(), word, type, prompt: word.german, options, correct: word.article };
      }
      return { id: uid(), word, type: "de-en", prompt: word.german, options: [word.english], correct: word.english };
    }

      const [typed, setTyped] = useState("");
      if (q.type === "de-en" || q.type === "en-de" || q.type === "article") {
        return (

    function SentenceBuilder({ th, item, onAnswer, answered, slowAudio }) {
      const [chosen, setChosen] = useState([]);
      const [bank, setBank] = useState(() => shuffle(item.words));
      const pick = (w, i) => { setChosen((c) => [...c, w]); setBank((b) => b.filter((_, idx) => idx !== i)); };
      const remove = (i) => { setBank((b) => [...b, chosen[i]]); setChosen((c) => c.filter((_, idx) => idx !== i)); };
      const submit = () => onAnswer(normalizeAnswer(chosen.join(" ")) === normalizeAnswer(item.answer_de), chosen.join(" "));
      return (
        <div>
          <div className="text-xs font-semibold mb-1" style={{ color: th.sub }}>Build the sentence</div>
          <div className="min-h-[46px] flex flex-wrap gap-2 rounded-xl border p-2 mb-3" style={{ borderColor: th.border, background: th.bg }}>
            {chosen.map((w, i) => (
              <button key={i} onClick={() => !answered && remove(i)} className="px-3 py-1.5 rounded-lg font-semibold text-sm text-white" style={{ background: th.cobalt }}>{w}</button>
            ))}
          </div>
          <div className="flex flex-wrap gap-2 mb-3">
            {bank.map((w, i) => (
              <button key={i} disabled={answered} onClick={() => pick(w, i)} className="px-3 py-1.5 rounded-lg font-semibold text-sm border" style={{ borderColor: th.border, color: th.ink }}>{w}</button>
            ))}
          </div>

              </button>
            </div>

          {!answered && <button onClick={submit} disabled={bank.length > 0} className="w-full py-3 rounded-xl font-bold text-white disabled:opacity-40" style={{ background: th.cobalt }}>Check</button>}
        </div>
      );
    }

    const QUICK_TYPES = [
      { id: "de-en", label: "German → English" }, { id: "en-de", label: "English → German" },

    function QuizHub({ th, data, setData, showToast, setCelebrate, goalMetToday, slowAudio }) {
      const [mode, setMode] = useState("menu");

          pool = pool.filter((w) => w.nextReview <= today);

          pool = pool.filter((w) => w.incorrectCount > w.correctCount);

        if (pool.length === 0) pool = [...data.vocab];

      const handleFlashcardReview = (wordId, gotIt) => {
        applyWordResult(wordId, gotIt);

            ...prev,
            stats: {
              ...prev.stats, xp: prev.stats.xp + xpGain,
              history: [{ type: "flashcards", text: `Studied ${flashcardWords.length} flashcards`, date: new Date().toISOString(), xp: xpGain }, ...prev.stats.history].slice(0, 50),
            },
          }));
          showToast(`+${xpGain} XP · Study complete!`, th.forest);
          setMode("flashcard-summary");
        } else {
          setIsFlipped(false);
          setFIndex((i) => i + 1);
        }
      };

      const dueSorted = useMemo(() => {
        const today = todayStr();
        return [...data.vocab].sort((a, b) => {
          const aDue = a.nextReview <= today ? 0 : 1; const bDue = b.nextReview <= today ? 0 : 1;
          if (aDue !== bDue) return aDue - bDue;
          return (b.incorrectCount - b.correctCount) - (a.incorrectCount - a.correctCount);
        });
      }, [data.vocab]);
      const struggleWords = useMemo(() => data.vocab.filter((w) => w.incorrectCount > w.correctCount).map((w) => w.german), [data.vocab]);

      const applyWordResult = useCallback((wordId, correct) => {
        setData((prev) => {
          const today = todayStr();
          const vocab = prev.vocab.map((w) => {
            if (w.id !== wordId) return w;
            if (correct) {
              const streakCount = (w.streakCount || 0) + 1;
              const interval = INTERVALS[Math.min(streakCount - 1, INTERVALS.length - 1)];
              return { ...w, correctCount: w.correctCount + 1, streakCount, nextReview: addDays(today, interval), status: streakCount >= 5 ? "mastered" : w.status, difficulty: "easy" };
            }
            return { ...w, incorrectCount: w.incorrectCount + 1, streakCount: 0, nextReview: addDays(today, 1), status: w.status === "mastered" ? "learning" : w.status, difficulty: "hard" };
          });
          return { ...prev, vocab };
        });
      }, [setData]);

      const finishQuiz = useCallback((totalCorrect, total) => {
        const perfect = totalCorrect === total && total > 0;
        const xpGain = perfect ? 50 : 20;
        setData((prev) => ({
          ...prev,
          quizHistory: [{ date: new Date().toISOString(), score: totalCorrect, total, perfect }, ...prev.quizHistory].slice(0, 100),
          stats: {
            ...prev.stats, xp: prev.stats.xp + xpGain,
            history: [{ type: "quiz", text: perfect ? "Perfect quiz score!" : `Completed a quiz (${totalCorrect}/${total})`, date: new Date().toISOString(), xp: xpGain }, ...prev.stats.history].slice(0, 50),
          },
        }));
        showToast(`+${xpGain} XP${perfect ? " · Perfect!" : ""}`, perfect ? th.mustard : th.forest);
        setMode("summary");
      }, [setData, showToast, th]);

      const startQuick = () => {
        const chosen = dueSorted.slice(0, Math.min(count, dueSorted.length));

      const answerQuick = (isCorrect, sel) => {
        setAnswered(true); setSelected(sel);

      const nextQuick = () => {
        if (qIndex + 1 >= questions.length) { finishQuiz(correctSoFar, questions.length); return; }

      const startAI = async () => {
        setMode("ai-loading"); setAiError("");
        try {
          const wordSample = sample(data.vocab, Math.min(50, data.vocab.length)).map((w) => (w.article ? w.article + " " : "") + w.german);

          const user = buildQuizUserPrompt(wordSample, struggleWords.slice(0, 15), aiType, Math.min(count, 6));
          const text = await claudeMessages([{ role: "user", content: user }], system, 1000);

          if (!items.length) throw new Error("empty");
          setQuestions(items); setQIndex(0); setAnswered(false); setSelected(null); setCorrectSoFar(0); setMode("ai-session");
        } catch (e) {
          // Seamless fallback using offline AI exercise engine!
          const fallbackItems = generateFallbackAIQuiz(aiType, Math.min(count, 6), data.vocab, struggleWords);
          setQuestions(fallbackItems); setQIndex(0); setAnswered(false); setSelected(null); setCorrectSoFar(0); setMode("ai-session");
        }
      };
      const answerAI = (isCorrect, sel) => { setAnswered(true); setSelected(sel); if (isCorrect) setCorrectSoFar((c) => c + 1); };
      const nextAI = () => {
        if (qIndex + 1 >= questions.length) { finishQuiz(correctSoFar, questions.length); return; }
        setQIndex((i) => i + 1); setAnswered(false); setSelected(null);

      useEffect(() => { if (mode === "summary" && goalMetToday) setCelebrate(true); }, [mode]);

      if (mode === "menu") {

            </div>
          </div>
        );
      }

      if (mode === "flashcards-setup") {
        const today = todayStr();
        const dueCount = data.vocab.filter((w) => w.nextReview <= today).length;

                <div className="absolute inset-0 w-full h-full rounded-2xl p-5 flex flex-col justify-between shadow-md border backface-hidden rotate-y-180"
                     style={{ background: th.card, borderColor: th.border }}>

                    <span className="text-[10px] uppercase font-bold tracking-wider" style={{ color: th.sub }}>Tap to Flip</span>
                    <span className="text-[10px] px-2 py-0.5 rounded-full font-semibold" style={{ background: th.bg, color: th.sub }}>{word.level}</span>

                  <div className="flex flex-col items-center justify-center flex-1 space-y-2">
                    <div className="font-extrabold text-2xl text-center" style={{ fontFamily: DISPLAY_FONT }}>{word.english}</div>
                    {word.example && (
                      <div className="text-xs italic text-center max-w-xs" style={{ color: th.sub }}>
                        "{word.example}"
                      </div>
                    )}
                    {word.notes && (
                      <div className="text-[10px] p-2 rounded-lg border border-dashed text-center max-w-xs" style={{ background: th.mustardSoft, color: th.mustard, borderColor: th.mustard }}>
                        💡 Mnemonic: {word.notes}
                      </div>
                    )}
                  </div>
                  
                  <div className="flex justify-between items-center text-[10px]" style={{ color: th.sub }}>
                    <span>Category: {word.category}</span>
                    <span>Back</span>
                  </div>
                </div>
                
              </div>
            </div>

            {/* Self Assessment Action Buttons */}
            {isFlipped && (
              <div className="flex gap-3 animate-[popIn_0.2s_ease-out]">
                <button onClick={() => handleFlashcardReview(word.id, false)} className="flex-1 py-3.5 rounded-xl font-extrabold text-sm flex items-center justify-center gap-1.5 transition-all active:scale-[0.98]"
                  style={{ background: th.brickSoft, color: th.brick }}>
                  Still practicing
                </button>
                <button onClick={() => handleFlashcardReview(word.id, true)} className="flex-1 py-3.5 rounded-xl font-extrabold text-sm flex items-center justify-center gap-1.5 transition-all active:scale-[0.98]"
                  style={{ background: th.forestSoft, color: th.forest }}>
                  Got it!
                </button>
              </div>
            )}
          </div>
        );
      }

      if (mode === "flashcard-summary") {
        return (
          <div className="flex flex-col items-center justify-center py-16 text-center">
            <Award size={44} style={{ color: th.forest }} className="mb-3" />
            <div className="font-extrabold text-2xl mb-1" style={{ fontFamily: DISPLAY_FONT }}>Session complete!</div>
            <div className="text-sm mb-6 max-w-xs" style={{ color: th.sub }}>You reviewed {flashcardWords.length} words and updated your review schedules!</div>
            <button onClick={() => setMode("menu")} className="px-6 py-3 rounded-xl font-bold text-white" style={{ background: th.cobalt }}>Back to quizzes</button>
          </div>
        );

      if (mode === "quick-setup") {
        return (
          <div className="space-y-4 pb-4">
            <button onClick={() => setMode("menu")} className="flex items-center gap-1 text-sm font-semibold" style={{ color: th.sub }}><ArrowLeft size={15} /> Back</button>
            <div className="rounded-2xl p-4" style={{ background: th.card, border: `1px solid ${th.border}` }}>
              <div className="font-bold text-sm mb-2">Question types</div>
              <div className="flex flex-wrap gap-2 mb-4">
                {QUICK_TYPES.map((t) => (
                  <Chip key={t.id} th={th} active={quickTypes.includes(t.id)} onClick={() => setQuickTypes((qt) => qt.includes(t.id) ? qt.filter((x) => x !== t.id) : [...qt, t.id])}>{t.label}</Chip>
                ))}
              </div>
              <div className="font-bold text-sm mb-2">Number of questions</div>
              <div className="flex gap-2 mb-4">
                {[5, 8, 12].map((n) => <button key={n} onClick={() => setCount(n)} className="flex-1 py-2 rounded-xl font-bold text-sm border" style={count === n ? { background: th.cobalt, color: "#fff", borderColor: th.cobalt } : { color: th.sub, borderColor: th.border }}>{n}</button>)}
              </div>
              <button onClick={startQuick} disabled={quickTypes.length === 0} className="w-full py-3 rounded-xl font-bold text-white disabled:opacity-40" style={{ background: th.cobalt }}>Start</button>
            </div>
          </div>
        );
      }
      if (mode === "quick-session") {
        const q = questions[qIndex];
        return (
          <div className="space-y-4 pb-4">
            <div className="flex items-center justify-between">
              <button onClick={() => setMode("menu")} className="p-1"><X size={18} style={{ color: th.sub }} /></button>
              <div className="text-xs font-semibold" style={{ color: th.sub }}>{qIndex + 1} / {questions.length}</div>
            </div>
            <ProgressBar value={(qIndex + (answered ? 1 : 0)) / questions.length} color={th.cobalt} track={th.border} />
            <div className="rounded-2xl p-5" style={{ background: th.card, border: `1px solid ${th.border}` }}>
              <QuestionCard th={th} q={q} onAnswer={answerQuick} answered={answered} selected={selected} slowAudio={slowAudio} />
            </div>
            {answered && <button onClick={nextQuick} className="w-full py-3 rounded-xl font-bold text-white" style={{ background: th.cobalt }}>{qIndex + 1 >= questions.length ? "Finish" : "Next"}</button>}
          </div>
        );
      }
      if (mode === "ai-setup") {
        return (
          <div className="space-y-4 pb-4">
            <button onClick={() => setMode("menu")} className="flex items-center gap-1 text-sm font-semibold" style={{ color: th.sub }}><ArrowLeft size={15} /> Back</button>
            <div className="rounded-2xl p-4" style={{ background: th.card, border: `1px solid ${th.border}` }}>
              <div className="font-bold text-sm mb-2">Exercise type</div>
              <div className="space-y-2 mb-4">
                {AI_TYPES.map((t) => (
                  <button key={t.id} onClick={() => setAiType(t.id)} className="w-full text-left px-3 py-2.5 rounded-xl border text-sm font-semibold"
                    style={aiType === t.id ? { background: th.mustardSoft, borderColor: th.mustard, color: th.mustard } : { borderColor: th.border, color: th.ink }}>{t.label}</button>
                ))}
              </div>
              <div className="font-bold text-sm mb-2">Number of questions</div>
              <div className="flex gap-2 mb-4">
                {[3, 5, 6].map((n) => <button key={n} onClick={() => setCount(n)} className="flex-1 py-2 rounded-xl font-bold text-sm border" style={count === n ? { background: th.mustard, color: "#fff", borderColor: th.mustard } : { color: th.sub, borderColor: th.border }}>{n}</button>)}
              </div>
              <button onClick={startAI} className="w-full py-3 rounded-xl font-bold text-white" style={{ background: th.mustard }}>Generate quiz</button>
            </div>
          </div>
        );
      }
      if (mode === "ai-loading") {
        return <div className="flex flex-col items-center justify-center py-24"><Loader2 size={28} className="animate-spin mb-3" style={{ color: th.mustard }} /><div className="text-sm" style={{ color: th.sub }}>Writing your exercises...</div></div>;
      }
      if (mode === "ai-error") {
        return (
          <div className="text-center py-16 px-4">
            <div className="text-sm mb-4" style={{ color: th.sub }}>{aiError}</div>
            <button onClick={startAI} className="px-5 py-2.5 rounded-xl font-bold text-white" style={{ background: th.mustard }}>Try again</button>
          </div>
        );
      }
      if (mode === "ai-session") {
        const item = questions[qIndex];
        return (
          <div className="space-y-4 pb-4">
            <div className="flex items-center justify-between">
              <button onClick={() => setMode("menu")} className="p-1"><X size={18} style={{ color: th.sub }} /></button>
              <div className="text-xs font-semibold" style={{ color: th.sub }}>{qIndex + 1} / {questions.length}</div>
            </div>
            <ProgressBar value={(qIndex + (answered ? 1 : 0)) / questions.length} color={th.mustard} track={th.border} />
            <div className="rounded-2xl p-5" style={{ background: th.card, border: `1px solid ${th.border}` }}>
              <AIQuestionCard th={th} item={item} onAnswer={answerAI} answered={answered} selected={selected} slowAudio={slowAudio} />
            </div>
            {answered && <button onClick={nextAI} className="w-full py-3 rounded-xl font-bold text-white" style={{ background: th.mustard }}>{qIndex + 1 >= questions.length ? "Finish" : "Next"}</button>}
          </div>
        );
      }
      if (mode === "summary") {
        const pct = questions.length ? Math.round((correctSoFar / questions.length) * 100) : 0;
        return (
          <div className="flex flex-col items-center justify-center py-16 text-center">
            <Trophy size={44} style={{ color: th.mustard }} className="mb-3" />
            <div className="font-extrabold text-2xl mb-1" style={{ fontFamily: DISPLAY_FONT }}>{correctSoFar}/{questions.length} correct</div>
            <div className="text-sm mb-6" style={{ color: th.sub }}>{pct}% accuracy this round</div>
            <button onClick={() => setMode("menu")} className="px-6 py-3 rounded-xl font-bold text-white" style={{ background: th.cobalt }}>Back to quizzes</button>
          </div>
        );
      }
      return null;
    }

    /* ============================================================
       AI TEACHER
       ============================================================ */
    function TeacherView({ th, data, setData }) {
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const scrollRef = useRef(null);
      useEffect(() => { scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" }); }, [data.teacherChat, loading]);

      const send = async (text) => {
        const msg = (text || input).trim();
        if (!msg || loading) return;
        setInput(""); setLoading(true);
        const history = [...data.teacherChat, { role: "user", content: msg }].slice(-40);
        setData((prev) => ({ ...prev, teacherChat: history }));
        try {
          const apiMessages = history.map((m) => ({ role: m.role, content: m.content }));
          const contextNote = `(Learner context: knows ${data.vocab.length} words, currently at ${getLevelInfo(data.vocab ? data.vocab.length : 0).current.name} level.)`;
          const reply = await claudeMessages(apiMessages, TEACHER_SYSTEM_PROMPT + " " + contextNote, 1000);
          setData((prev) => ({ ...prev, teacherChat: [...prev.teacherChat, { role: "assistant", content: reply || "Entschuldigung, please try asking again." }].slice(-40) }));
        } catch (e) {
          const fallbackReply = generateFallbackTeacherReply(msg, data.vocab);
          setData((prev) => ({ ...prev, teacherChat: [...prev.teacherChat, { role: "assistant", content: fallbackReply }].slice(-40) }));
        } finally { setLoading(false); }
      };
      const suggestions = ["Explain \"gehen\"", "Correct: Ich gehen Schule", "How do I say I'm hungry?", "der/die/das rule?"];

      return (
        <div className="flex flex-col h-full min-h-0">
          <div ref={scrollRef} className="flex-1 h-0 overflow-y-auto space-y-3 pb-3">
            {data.teacherChat.length === 0 && (
              <div className="rounded-2xl p-4 text-sm" style={{ background: th.cobaltSoft, color: th.cobalt }}>
                Hallo! I'm your AI German teacher. Ask me to explain a word, check your grammar, or build example sentences — all kept at your A1 level.
              </div>
            )}
            {data.teacherChat.map((m, i) => (
              <div key={i} className={"max-w-[85%] rounded-2xl px-3.5 py-2.5 text-sm " + (m.role === "user" ? "ml-auto" : "")}
                style={m.role === "user" ? { background: th.cobalt, color: "#fff" } : { background: th.card, color: th.ink, border: `1px solid ${th.border}` }}>
                {renderLite(m.content)}
              </div>
            ))}
            {loading && <div className="rounded-2xl px-3.5 py-2.5 text-sm w-fit" style={{ background: th.card, border: `1px solid ${th.border}` }}><Loader2 size={14} className="animate-spin" style={{ color: th.sub }} /></div>}
          </div>
          {data.teacherChat.length === 0 && (
            <div className="flex flex-wrap gap-2 mb-2 shrink-0">
              {suggestions.map((s) => <button key={s} onClick={() => send(s)} className="text-xs font-semibold px-3 py-1.5 rounded-full" style={{ background: th.bg, color: th.sub }}>{s}</button>)}
            </div>
          )}
          <div className="flex items-center gap-2 shrink-0 pt-2">
            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Ask about a word, grammar, or a sentence..."
              className="flex-1 rounded-xl px-3.5 py-3 text-sm outline-none border" style={{ background: th.card, color: th.ink, borderColor: th.border }} />
            <button onClick={() => send()} disabled={loading || !input.trim()} className="p-3 rounded-xl text-white disabled:opacity-40" style={{ background: th.cobalt }}><Send size={16} /></button>
          </div>
        </div>
      );
    }

    /* ============================================================
       PROFILE / STATS
       ============================================================ */
    function ProfileView({ th, data, setData, onResetAll, showToast }) {
      const level = getLevelInfo(data.vocab ? data.vocab.length : 0);
      const [confirmReset, setConfirmReset] = useState(false);
      const earnedBadges = BADGE_DEFS.filter((b) => b.test(data.stats, data.quizHistory));
      const fileRef = useRef(null);

      const buyFreeze = () => {
        if (data.stats.xp < 150) { showToast("Need 150 XP to buy a freeze!", th.brick); return; }
        setData((prev) => ({
          ...prev,
          stats: {
            ...prev.stats,
            xp: prev.stats.xp - 150,
            streakFreezes: (prev.stats.streakFreezes || 0) + 1,
            history: [{ type: "shop", text: "Bought a Streak Freeze", date: new Date().toISOString(), xp: -150 }, ...prev.stats.history].slice(0, 50),
          },
        }));
        showToast("Streak Freeze purchased! 🛡️", th.forest);
      };

      const useFreeze = () => {
        if (!data.stats.streakFreezes || data.stats.streakFreezes < 1) return;
        const today = todayStr();
        setData((prev) => ({
          ...prev,
          stats: {
            ...prev.stats,
            streakFreezes: prev.stats.streakFreezes - 1,
            lastStreakDate: today,
            goalBankedUntil: today,
            history: [{ type: "freeze", text: "Used a Streak Freeze to protect today's streak", date: new Date().toISOString(), xp: 0 }, ...prev.stats.history].slice(0, 50),
          },
        }));
        showToast("Streak protected! 🛡️", th.forest);
      };

      const exportData = () => {
        const blob = new Blob([JSON.stringify(data.vocab, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "vokabeln-backup.json";
        a.click(); URL.revokeObjectURL(url);
        showToast("Vocabulary exported!", th.forest);
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const imported = JSON.parse(ev.target.result);
            if (!Array.isArray(imported)) throw new Error("Not an array");
            const today = todayStr();
            const newWords = imported.map((w) => ({
              id: uid(), german: w.german || "", english: w.english || "",
              article: w.article || "", plural: w.plural || "",
              example: w.example || "", exampleEn: w.exampleEn || "",
              notes: w.notes || "", category: w.category || "Actions",
              level: w.level || "A1", dateAdded: today, difficulty: "medium",
              correctCount: 0, incorrectCount: 0, streakCount: 0,
              status: "learning", nextReview: today,
            })).filter((w) => w.german && w.english);
            setData((prev) => ({
              ...prev, vocab: [...prev.vocab, ...newWords],
              stats: { ...prev.stats, totalWordsLearned: prev.vocab.length + newWords.length },
            }));
            showToast(`Imported ${newWords.length} words!`, th.forest);
          } catch (err) {
            showToast("Invalid file format.", th.brick);
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      return (
        <div className="space-y-4 pb-4">
          <div className="rounded-3xl p-5 flex items-center gap-4" style={{ background: th.card, border: `1px solid ${th.border}` }}>
            <StampBadge value={level.index + 1} label={level.current.tag} color={th.cobalt} size={72} />
            <div className="flex-1 min-w-0">
              <div className="font-extrabold text-lg" style={{ fontFamily: DISPLAY_FONT }}>{data.profile.name}</div>
              <div className="text-sm" style={{ color: th.sub }}>{level.current.name}</div>
              <div className="flex items-center gap-3 mt-1">
                <span className="text-xs font-bold" style={{ color: th.sub }}>{data.stats.xp} XP</span>
                {data.stats.streakFreezes > 0 && (
                  <span className="text-xs font-extrabold flex items-center gap-0.5 px-2 py-0.5 rounded-full" style={{ background: th.cobaltSoft, color: th.cobalt }}>🛡️ {data.stats.streakFreezes}</span>
                )}
              </div>
            </div>
          </div>

          <div className="rounded-2xl p-4" style={{ background: th.card, border: `1px solid ${th.border}` }}>
            <div className="font-bold text-sm mb-3">Achievements ({earnedBadges.length}/{BADGE_DEFS.length})</div>
            <div className="grid grid-cols-3 gap-3">
              {BADGE_DEFS.map((b) => {
                const earned = earnedBadges.includes(b);
                const Icon = ICONS[b.icon] || Award;
                return (
                  <div key={b.id} className="rounded-xl p-3 text-center" style={{ background: earned ? th.mustardSoft : th.bg, opacity: earned ? 1 : 0.5 }}>
                    <Icon size={20} style={{ color: earned ? th.mustard : th.sub, margin: "0 auto 4px" }} />
                    <div className="text-[10px] font-bold leading-tight">{b.label}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Streak Freeze Shop */}
          <div className="rounded-2xl p-4" style={{ background: th.card, border: `1px solid ${th.border}` }}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-base">🛡️</span>
              <div className="font-bold text-sm">Streak Freeze Shop</div>
            </div>
            <div className="text-xs mb-3" style={{ color: th.sub }}>Protect your streak when you can't practice. You have <strong>{data.stats.streakFreezes || 0}</strong> freeze(s).</div>
            <div className="flex gap-2">
              <button onClick={buyFreeze} disabled={data.stats.xp < 150}
                className="flex-1 py-2.5 rounded-xl font-bold text-sm border disabled:opacity-40"
                style={data.stats.xp >= 150 ? { background: th.cobaltSoft, color: th.cobalt, borderColor: th.cobalt } : { color: th.sub, borderColor: th.border }}>
                Buy Freeze · 150 XP
              </button>
              <button onClick={useFreeze} disabled={!data.stats.streakFreezes}
                className="flex-1 py-2.5 rounded-xl font-bold text-sm border disabled:opacity-40"
                style={data.stats.streakFreezes > 0 ? { background: th.forestSoft, color: th.forest, borderColor: th.forest } : { color: th.sub, borderColor: th.border }}>
                Use Freeze
              </button>
            </div>
          </div>

          {/* Settings */}
          <div className="rounded-2xl p-4" style={{ background: th.card, border: `1px solid ${th.border}` }}>
            <div className="font-bold text-sm mb-3">Settings</div>

            <div className="mb-3">
              <div className="text-xs font-semibold mb-1.5" style={{ color: th.sub }}>Daily word goal</div>
              <div className="flex gap-2">
                {[5, 10, 15, 20].map((n) => (
                  <button key={n} onClick={() => setData((prev) => ({ ...prev, profile: { ...prev.profile, dailyGoal: n } }))}
                    className="flex-1 py-2 rounded-xl font-bold text-sm border" style={data.profile.dailyGoal === n ? { background: th.cobalt, color: "#fff", borderColor: th.cobalt } : { color: th.sub, borderColor: th.border }}>{n}</button>
                ))}
              </div>
            </div>

            {/* Slow Audio Toggle */}
            <div className="flex items-center justify-between py-2.5 border-t" style={{ borderColor: th.border }}>
              <div>
                <div className="text-sm font-semibold">🐢 Slow Pronunciation</div>
                <div className="text-xs" style={{ color: th.sub }}>Play audio at a slower, clearer speed</div>
              </div>
              <button onClick={() => setData((prev) => ({ ...prev, profile: { ...prev.profile, slowAudio: !prev.profile.slowAudio } }))}
                className="w-12 h-6 rounded-full relative transition-all flex-shrink-0"
                style={{ background: data.profile.slowAudio ? th.cobalt : th.border }}>
                <span className="absolute top-0.5 w-5 h-5 bg-white rounded-full shadow transition-all"
                  style={{ left: data.profile.slowAudio ? "calc(100% - 22px)" : "2px" }} />
              </button>
            </div>

            {/* Custom Anthropic API Key */}
            <div className="flex items-center justify-between py-2.5 border-t" style={{ borderColor: th.border }}>
              <div>
                <div className="text-sm font-semibold">🔑 Anthropic API Key (Optional)</div>
                <div className="text-xs" style={{ color: th.sub }}>For live Anthropic API connection (leave empty to use local AI engine)</div>
              </div>
              <input
                type="password"
                placeholder="sk-ant-..."
                value={data.profile.apiKey || window.localStorage.getItem("anthropic_api_key") || ""}
                onChange={(e) => {
                  const val = e.target.value;
                  window.localStorage.setItem("anthropic_api_key", val);
                  setData((prev) => ({ ...prev, profile: { ...prev.profile, apiKey: val } }));
                }}
                className="w-28 rounded-lg px-2 py-1 text-xs outline-none border"
                style={{ background: th.bg, color: th.ink, borderColor: th.border }}
              />
            </div>

            {/* Backup / Restore */}
            <div className="flex items-center justify-between py-2.5 border-t" style={{ borderColor: th.border }}>
              <div>
                <div className="text-sm font-semibold">📂 Backup / Restore</div>
                <div className="text-xs" style={{ color: th.sub }}>Export or import your vocabulary list</div>
              </div>
              <div className="flex gap-2">
                <button onClick={exportData} className="px-3 py-1.5 rounded-lg text-xs font-bold border" style={{ borderColor: th.border, color: th.ink }}>Export</button>
                <button onClick={() => fileRef.current.click()} className="px-3 py-1.5 rounded-lg text-xs font-bold border" style={{ borderColor: th.cobalt, color: th.cobalt }}>Import</button>
                <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={importData} />
              </div>
            </div>

            {/* Reset */}
            <div className="pt-2.5 border-t" style={{ borderColor: th.border }}>
              {!confirmReset ? (
                <button onClick={() => setConfirmReset(true)} className="w-full py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-1.5" style={{ background: th.brickSoft, color: th.brick }}>
                  <RotateCcw size={14} /> Reset all progress
                </button>
              ) : (
                <div className="flex gap-2">
                  <button onClick={() => setConfirmReset(false)} className="flex-1 py-2.5 rounded-xl font-semibold text-sm" style={{ background: th.bg, color: th.sub }}>Cancel</button>
                  <button onClick={onResetAll} className="flex-1 py-2.5 rounded-xl font-semibold text-sm text-white" style={{ background: th.brick }}>Confirm reset</button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================

      const [activeTab, setActiveTab] = useState("dashboard");
      const [toast, setToast] = useState(null);
      const [celebrate, setCelebrate] = useState(false);
      const saveTimer = useRef(null);
      const prevGoalMet = useRef(false);

      useEffect(() => {
        const linkId = "gv-fonts-link";
        if (!document.getElementById(linkId)) {
          const link = document.createElement("link");
          link.id = linkId; link.rel = "stylesheet";
          link.href = "https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap";
          document.head.appendChild(link);
        }
      }, []);

      useEffect(() => {
        (async () => {
          let fresh = null;
          try {
            const res = await window.storage.get("appData", false);
            fresh = res ? JSON.parse(res.value) : null;
          } catch (e) { fresh = null; }
          if (!fresh) {
            fresh = createInitialData();
            try { await window.storage.set("appData", JSON.stringify(fresh), false); } catch (e) {}
          } else {
            if (!fresh.stats) fresh.stats = createInitialData().stats;
            if (!fresh.vocab) fresh.vocab = createInitialData().vocab;
            if (!fresh.profile) fresh.profile = createInitialData().profile;
            if (!fresh.quizHistory) fresh.quizHistory = [];
            if (!fresh.teacherChat) fresh.teacherChat = [];
            if (!fresh.stats.wordsAddedLog) fresh.stats.wordsAddedLog = {};
            if (fresh.stats.streakFreezes === undefined) fresh.stats.streakFreezes = 0;
            if (fresh.profile.slowAudio === undefined) fresh.profile.slowAudio = false;
            fresh = { ...fresh, stats: checkStreakDecay(fresh.stats) };
          }
          setData(fresh); setLoading(false);
        })();
      }, []);

      useEffect(() => {
        if (loading || !data) return;
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => { window.storage.set("appData", JSON.stringify(data), false).catch(() => {}); }, 500);
        return () => clearTimeout(saveTimer.current);
      }, [data, loading]);

      const showToast = useCallback((text, color) => {
        setToast({ text, color, key: Date.now() });
        setTimeout(() => setToast(null), 1900);
      }, []);

      const dueWords = useMemo(() => {
        if (!data) return [];
        const today = todayStr();
        return data.vocab.filter((w) => w.nextReview <= today);
      }, [data]);
      const todayAdded = data ? ((data.stats.wordsAddedLog && data.stats.wordsAddedLog[todayStr()]) || 0) : 0;
      const goalMetToday = data ? (data.stats.goalBankedUntil && data.stats.goalBankedUntil >= todayStr()) : false;

      useEffect(() => {
        if (goalMetToday && !prevGoalMet.current) setCelebrate(true);
        prevGoalMet.current = goalMetToday;
      }, [goalMetToday]);

      const toggleDark = () => setData((prev) => ({ ...prev, profile: { ...prev.profile, darkMode: !prev.profile.darkMode } }));
      const resetAll = async () => {
        const fresh = createInitialData();
        setData(fresh);
        try { await window.storage.set("appData", JSON.stringify(fresh), false); } catch (e) {}
        setActiveTab("dashboard");
      };

      if (loading || !data) {
        return (
          <div className="w-full flex items-center justify-center" style={{ minHeight: 500, fontFamily: BODY_FONT }}>
            <Loader2 size={26} className="animate-spin" style={{ color: "#2B4C7E" }} />
          </div>
        );
      }

      const th = PALETTE[data.profile.darkMode ? "dark" : "light"];

      return (
        <div className="w-full h-[100dvh] sm:h-[780px] sm:max-w-[460px] sm:rounded-3xl sm:shadow-xl overflow-hidden flex flex-col mx-auto" style={{ background: th.bg, color: th.ink, fontFamily: BODY_FONT, position: "relative" }}>
          <style>{`
            @keyframes stampFall { 0%{ transform: translateY(-20px) rotate(0deg); opacity:0;} 10%{opacity:1;} 100%{ transform: translateY(500px) rotate(360deg); opacity:0; } }
            @keyframes popIn { 0%{ transform: scale(0.85); opacity:0;} 100%{ transform: scale(1); opacity:1; } }
            @keyframes floatUp { 0%{ transform: translate(-50%,0); opacity:1;} 80%{ opacity:1;} 100%{ transform: translate(-50%,-30px); opacity:0; } }
            .perspective-1000 { perspective: 1000px; }
            .preserve-3d { transform-style: preserve-3d; }
            .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
            .rotate-y-180 { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
            .flipped { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
          `}</style>
          <TopBar th={th} stats={data.stats} darkMode={data.profile.darkMode} onToggleDark={toggleDark} />
          <div className="flex-1 overflow-y-auto px-4 pt-1 min-h-0">
            {activeTab === "dashboard" && <Dashboard th={th} data={data} dueWords={dueWords} goalMetToday={goalMetToday} todayAdded={todayAdded} onGoTab={setActiveTab} slowAudio={data.profile.slowAudio} />}
            {activeTab === "vocab" && <VocabularyView th={th} data={data} setData={setData} showToast={showToast} slowAudio={data.profile.slowAudio} />}
            {activeTab === "quiz" && <QuizHub th={th} data={data} setData={setData} showToast={showToast} setCelebrate={setCelebrate} goalMetToday={goalMetToday} slowAudio={data.profile.slowAudio} />}
            {activeTab === "teacher" && <TeacherView th={th} data={data} setData={setData} />}
            {activeTab === "profile" && <ProfileView th={th} data={data} setData={setData} onResetAll={resetAll} showToast={showToast} />}
          </div>
          <BottomNav active={activeTab} onChange={setActiveTab} th={th} />
          {celebrate && <CelebrationOverlay th={th} onDone={() => setCelebrate(false)} />}
          {toast && <Toast key={toast.key} text={toast.text} color={toast.color} th={th} />}
        </div>
      );
    }

    // Mount React App inside root container
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
